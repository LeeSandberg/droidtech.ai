<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Private Beta</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1224;color:#e2e8f0;font-family:system-ui,sans-serif}
  .card{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:28px;max-width:520px;width:92%}
  input,button{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:#0b1224;color:#e2e8f0}
  button{margin-top:10px;background:#4f46e5;border-color:#4f46e5;cursor:pointer}
  small{color:#94a3b8}
</style></head><body>
<div class="card">
  <h2>Private Beta</h2>
  <p>This page is invite-only. Enter your access key.</p>
  <input id="k" type="password" placeholder="Access key" autocomplete="off">
  <button onclick="go()">Unlock</button>
  <p><small>No key? <a href="/#contact" style="color:#93c5fd">Request access</a>.</small></p>
</div>
<script>
  const REQUIRED = "d42-beta-2025"; // must match pricing.html
  function go(){
    const v=document.getElementById('k').value.trim();
    if(v!==REQUIRED){alert('Invalid key');return;}
    const exp=new Date(Date.now()+8*60*60*1000).toUTCString();
    document.cookie="beta_key="+encodeURIComponent(v)+"; path=/; SameSite=Lax; expires="+exp;
    location.href="/pricing.html";
  }
</script>
</body></html>
